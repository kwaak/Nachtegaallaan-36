<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtegaallaan 36 - Gang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #info h2 { margin-bottom: 4px; font-size: 16px; }
        #dimensions { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Nachtegaallaan 36 - Gang</h2>
        <div id="dimensions">1.2m breed &times; 6m lang &times; 3m hoog</div>
        <div style="margin-top:6px; font-size:12px; color:#999;">
            Klik + sleep om te draaien<br>
            Scrollwiel om te zoomen<br>
            Rechtermuisknop om te pannen
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.5, 2.5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0.6, 1.5, 3);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        // --- Gang dimensions ---
        // Gang runs along the left side of the house, from front (z=L) to back
        // In the house: gang is to the left of the woonkamer
        const W = 1.2;  // breedte (x)
        const L = 6;    // lengte (z) - from front door area to back
        const H = 3;    // hoogte (y)

        // --- Materials ---
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd4c4a8, roughness: 0.7 });
        // Tile pattern for hallway floor
        const tileCanvas = document.createElement('canvas');
        tileCanvas.width = 256;
        tileCanvas.height = 256;
        const tCtx = tileCanvas.getContext('2d');
        tCtx.fillStyle = '#d4c4a8';
        tCtx.fillRect(0, 0, 256, 256);
        tCtx.strokeStyle = '#c0b090';
        tCtx.lineWidth = 2;
        for (let i = 0; i <= 256; i += 64) {
            tCtx.beginPath(); tCtx.moveTo(i, 0); tCtx.lineTo(i, 256); tCtx.stroke();
            tCtx.beginPath(); tCtx.moveTo(0, i); tCtx.lineTo(256, i); tCtx.stroke();
        }
        const tileTex = new THREE.CanvasTexture(tileCanvas);
        tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
        tileTex.repeat.set(W * 2, L * 2);
        floorMat.map = tileTex;

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.9 });
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
        const plintMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.5 });
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 });
        const doorMat = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.6 });
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8, roughness: 0.2 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0xb8956a, roughness: 0.7 });

        function addFrame(x, y, z, w, h, d) {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
            frame.position.set(x, y, z);
            frame.castShadow = true;
            scene.add(frame);
        }

        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(W / 2, 0, L / 2);
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, L), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(W / 2, H, L / 2);
        scene.add(ceiling);

        // =============================================
        // Front wall (z=L) - VOORDEUR
        // =============================================
        const voordeurW = 0.95;
        const voordeurH = 2.2;
        const voordeurX = W / 2;

        const frontWallGroup = new THREE.Group();
        // Left of front door
        const fw1W = voordeurX - voordeurW / 2;
        if (fw1W > 0.01) {
            const fw1 = new THREE.Mesh(new THREE.PlaneGeometry(fw1W, H), wallMat);
            fw1.position.set(fw1W / 2, H / 2, 0);
            frontWallGroup.add(fw1);
        }
        // Right of front door
        const fw2L = voordeurX + voordeurW / 2;
        const fw2W = W - fw2L;
        if (fw2W > 0.01) {
            const fw2 = new THREE.Mesh(new THREE.PlaneGeometry(fw2W, H), wallMat);
            fw2.position.set(fw2L + fw2W / 2, H / 2, 0);
            frontWallGroup.add(fw2);
        }
        // Above front door
        const fwAbove = new THREE.Mesh(new THREE.PlaneGeometry(voordeurW, H - voordeurH), wallMat);
        fwAbove.position.set(voordeurX, voordeurH + (H - voordeurH) / 2, 0);
        frontWallGroup.add(fwAbove);
        frontWallGroup.rotation.y = Math.PI;
        frontWallGroup.position.z = L;
        scene.add(frontWallGroup);

        // Front door frame
        addFrame(voordeurX, voordeurH / 2, L, 0.05, voordeurH, 0.12);  // center (both sides very narrow)
        addFrame(voordeurX - voordeurW / 2, voordeurH / 2, L, 0.05, voordeurH, 0.12);
        addFrame(voordeurX + voordeurW / 2, voordeurH / 2, L, 0.05, voordeurH, 0.12);
        addFrame(voordeurX, voordeurH, L, voordeurW + 0.05, 0.05, 0.12);

        // Front door (heavy, with glass panel on top)
        const voordeurMat = new THREE.MeshStandardMaterial({ color: 0x3a5a3a, roughness: 0.5 });
        const voordeur = new THREE.Mesh(new THREE.BoxGeometry(0.93, voordeurH - 0.05, 0.06), voordeurMat);
        voordeur.position.set(voordeurX, voordeurH / 2, L - 0.01);
        scene.add(voordeur);
        // Glass panel in front door
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff, transparent: true, opacity: 0.4,
            roughness: 0.0, metalness: 0.1, transmission: 0.6,
        });
        const vdGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), glassMat);
        vdGlass.position.set(0, 0.55, 0.035);
        voordeur.add(vdGlass);
        // Letter slot
        const letterSlot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.04, 0.07), handleMat);
        letterSlot.position.set(0, -0.15, 0.035);
        voordeur.add(letterSlot);
        // Door handle
        const vdHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.15, 0.05), handleMat);
        vdHandle.position.set(0.35, 0, 0.035);
        voordeur.add(vdHandle);

        // =============================================
        // Back wall (z=0) - deur naar keuken
        // =============================================
        const keukenDeurW = 0.85;
        const keukenDeurH = 2.1;
        const keukenDeurX = W / 2;

        const backWallGroup = new THREE.Group();
        const bw1W = keukenDeurX - keukenDeurW / 2;
        if (bw1W > 0.01) {
            const bw1 = new THREE.Mesh(new THREE.PlaneGeometry(bw1W, H), wallMat);
            bw1.position.set(bw1W / 2, H / 2, 0);
            backWallGroup.add(bw1);
        }
        const bw2L = keukenDeurX + keukenDeurW / 2;
        const bw2W = W - bw2L;
        if (bw2W > 0.01) {
            const bw2 = new THREE.Mesh(new THREE.PlaneGeometry(bw2W, H), wallMat);
            bw2.position.set(bw2L + bw2W / 2, H / 2, 0);
            backWallGroup.add(bw2);
        }
        const bwAbove = new THREE.Mesh(new THREE.PlaneGeometry(keukenDeurW, H - keukenDeurH), wallMat);
        bwAbove.position.set(keukenDeurX, keukenDeurH + (H - keukenDeurH) / 2, 0);
        backWallGroup.add(bwAbove);
        backWallGroup.position.z = 0;
        scene.add(backWallGroup);

        // Kitchen door from hallway
        addFrame(keukenDeurX - keukenDeurW / 2, keukenDeurH / 2, 0, 0.05, keukenDeurH, 0.1);
        addFrame(keukenDeurX + keukenDeurW / 2, keukenDeurH / 2, 0, 0.05, keukenDeurH, 0.1);
        addFrame(keukenDeurX, keukenDeurH, 0, keukenDeurW + 0.05, 0.05, 0.1);
        const keukenDeur = new THREE.Mesh(new THREE.BoxGeometry(0.83, keukenDeurH - 0.05, 0.04), doorMat);
        keukenDeur.geometry.translate(0.415, 0, 0);
        keukenDeur.position.set(keukenDeurX - keukenDeurW / 2 + 0.02, keukenDeurH / 2, 0);
        keukenDeur.rotation.y = 0.3;
        scene.add(keukenDeur);
        const kdHandle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.03), handleMat);
        kdHandle.position.set(0.72, 0, 0.03);
        keukenDeur.add(kdHandle);

        // =============================================
        // Right wall (x=W) - WOONKAMER KANT
        // Dubbele deuren naar woonkamer at z ≈ 4.0 (maps to woonkamer z=10)
        // =============================================
        const wkDoorW = 1.6;
        const wkDoorH = 2.1;
        const wkDoorZ = 4.0;

        const rightWallGroup = new THREE.Group();
        // Before double doors
        const rw1W = wkDoorZ - wkDoorW / 2;
        const rw1 = new THREE.Mesh(new THREE.PlaneGeometry(rw1W, H), wallMat);
        rw1.position.set(rw1W / 2, H / 2, 0);
        rightWallGroup.add(rw1);
        // Above double doors
        const rwAbove = new THREE.Mesh(new THREE.PlaneGeometry(wkDoorW, H - wkDoorH), wallMat);
        rwAbove.position.set(wkDoorZ, wkDoorH + (H - wkDoorH) / 2, 0);
        rightWallGroup.add(rwAbove);
        // After double doors
        const rw3L = wkDoorZ + wkDoorW / 2;
        const rw3W = L - rw3L;
        const rw3 = new THREE.Mesh(new THREE.PlaneGeometry(rw3W, H), wallMat);
        rw3.position.set(rw3L + rw3W / 2, H / 2, 0);
        rightWallGroup.add(rw3);

        rightWallGroup.rotation.y = -Math.PI / 2;
        rightWallGroup.position.set(W, 0, 0);
        scene.add(rightWallGroup);

        // Double door frame (viewed from hallway side)
        addFrame(W, wkDoorH / 2, wkDoorZ - wkDoorW / 2, 0.1, wkDoorH, 0.05);
        addFrame(W, wkDoorH / 2, wkDoorZ + wkDoorW / 2, 0.1, wkDoorH, 0.05);
        addFrame(W, wkDoorH, wkDoorZ, 0.1, 0.05, wkDoorW + 0.05);

        // =============================================
        // Left wall (x=0) - buitenmuur/buurmuur
        // WC deur (z ≈ 1.5) + kelderdeur (z ≈ 2.8)
        // =============================================
        const wcDoorW = 0.7;
        const wcDoorH = 2.1;
        const wcDoorZ = 1.5;
        const kelderDoorW = 0.75;
        const kelderDoorH = 2.1;
        const kelderDoorZ = 3.2;

        const leftWallGroup = new THREE.Group();
        // Section 1: z=0 to WC door
        const lw1W = wcDoorZ - wcDoorW / 2;
        const lw1 = new THREE.Mesh(new THREE.PlaneGeometry(lw1W, H), wallMat);
        lw1.position.set(lw1W / 2, H / 2, 0);
        leftWallGroup.add(lw1);
        // Above WC door
        const lwWcAbove = new THREE.Mesh(new THREE.PlaneGeometry(wcDoorW, H - wcDoorH), wallMat);
        lwWcAbove.position.set(wcDoorZ, wcDoorH + (H - wcDoorH) / 2, 0);
        leftWallGroup.add(lwWcAbove);
        // Between WC and kelder
        const lw2L = wcDoorZ + wcDoorW / 2;
        const lw2R = kelderDoorZ - kelderDoorW / 2;
        const lw2W = lw2R - lw2L;
        const lw2 = new THREE.Mesh(new THREE.PlaneGeometry(lw2W, H), wallMat);
        lw2.position.set(lw2L + lw2W / 2, H / 2, 0);
        leftWallGroup.add(lw2);
        // Above kelder door
        const lwKelderAbove = new THREE.Mesh(new THREE.PlaneGeometry(kelderDoorW, H - kelderDoorH), wallMat);
        lwKelderAbove.position.set(kelderDoorZ, kelderDoorH + (H - kelderDoorH) / 2, 0);
        leftWallGroup.add(lwKelderAbove);
        // After kelder door to end
        const lw3L = kelderDoorZ + kelderDoorW / 2;
        const lw3W = L - lw3L;
        const lw3 = new THREE.Mesh(new THREE.PlaneGeometry(lw3W, H), wallMat);
        lw3.position.set(lw3L + lw3W / 2, H / 2, 0);
        leftWallGroup.add(lw3);

        leftWallGroup.rotation.y = Math.PI / 2;
        leftWallGroup.position.set(0, 0, 0);
        scene.add(leftWallGroup);

        // WC door
        addFrame(0, wcDoorH / 2, wcDoorZ - wcDoorW / 2, 0.1, wcDoorH, 0.05);
        addFrame(0, wcDoorH / 2, wcDoorZ + wcDoorW / 2, 0.1, wcDoorH, 0.05);
        addFrame(0, wcDoorH, wcDoorZ, 0.1, 0.05, wcDoorW + 0.05);
        const wcDoor = new THREE.Mesh(new THREE.BoxGeometry(0.04, wcDoorH - 0.05, 0.68), doorMat);
        wcDoor.position.set(0, wcDoorH / 2, wcDoorZ);
        scene.add(wcDoor);
        const wcHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.08), handleMat);
        wcHandle.position.set(0.03, 0, 0.28);
        wcDoor.add(wcHandle);

        // Kelder door (trap naar kelder)
        addFrame(0, kelderDoorH / 2, kelderDoorZ - kelderDoorW / 2, 0.1, kelderDoorH, 0.05);
        addFrame(0, kelderDoorH / 2, kelderDoorZ + kelderDoorW / 2, 0.1, kelderDoorH, 0.05);
        addFrame(0, kelderDoorH, kelderDoorZ, 0.1, 0.05, kelderDoorW + 0.05);
        const kelderDoor = new THREE.Mesh(new THREE.BoxGeometry(0.04, kelderDoorH - 0.05, 0.73), doorMat);
        kelderDoor.position.set(0, kelderDoorH / 2, kelderDoorZ);
        scene.add(kelderDoor);
        const kelderHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.08), handleMat);
        kelderHandle.position.set(0.03, 0, 0.30);
        kelderDoor.add(kelderHandle);

        // =============================================
        // Open trap naar 1e verdieping (along right wall, near front)
        // =============================================
        const trapStartZ = 4.5;
        const trapEndZ = L - 0.3;
        const trapW = 0.85;
        const stairCount = 14;
        const stairH = H / stairCount;
        const stairD = (trapEndZ - trapStartZ) / stairCount;

        for (let i = 0; i < stairCount; i++) {
            const stair = new THREE.Mesh(
                new THREE.BoxGeometry(trapW, stairH, stairD),
                woodMat
            );
            stair.position.set(
                W - trapW / 2 - 0.05,
                stairH / 2 + i * stairH,
                trapStartZ + stairD / 2 + i * stairD
            );
            stair.castShadow = true;
            stair.receiveShadow = true;
            scene.add(stair);
        }

        // Stair railing (simple posts + rail)
        const railMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.5 });
        for (let i = 0; i <= stairCount; i += 2) {
            const postH = 0.9;
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, postH, 8), railMat);
            post.position.set(
                W - trapW - 0.05,
                i * stairH + postH / 2,
                trapStartZ + i * stairD
            );
            scene.add(post);
        }
        // Handrail
        const railLen = Math.sqrt(Math.pow(trapEndZ - trapStartZ, 2) + Math.pow(H, 2));
        const railAngle = Math.atan2(H, trapEndZ - trapStartZ);
        const handrail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, railLen, 8), railMat);
        handrail.rotation.x = Math.PI / 2 - railAngle;
        handrail.position.set(
            W - trapW - 0.05,
            H / 2 + 0.45,
            (trapStartZ + trapEndZ) / 2
        );
        scene.add(handrail);

        // --- Lighting ---
        const ambient = new THREE.AmbientLight(0xfff5e6, 0.5);
        scene.add(ambient);

        const ceilingLight = new THREE.PointLight(0xfff5e0, 1.0, 15);
        ceilingLight.position.set(W / 2, H - 0.15, L / 2);
        ceilingLight.castShadow = true;
        scene.add(ceilingLight);

        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 });
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.06, 16), fixtureMat);
        fixture.position.set(W / 2, H - 0.03, L / 2);
        scene.add(fixture);

        const sunLight = new THREE.DirectionalLight(0xfff8e0, 0.8);
        sunLight.position.set(W / 2, 4, L + 3);
        sunLight.target.position.set(W / 2, 0, L / 2);
        sunLight.castShadow = true;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
