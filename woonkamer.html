<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtegaallaan 36 - Woonkamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #info h2 { margin-bottom: 4px; font-size: 16px; }
        #dimensions { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Nachtegaallaan 36 - Woonkamer</h2>
        <div id="dimensions">4m breed &times; 12m lang &times; 3m hoog</div>
        <div style="margin-top:6px; font-size:12px; color:#999;">
            Klik + sleep om te draaien<br>
            Scrollwiel om te zoomen<br>
            Rechtermuisknop om te pannen
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(2, 1.5, 6);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        // --- Room dimensions (meters) ---
        const W = 4;   // breedte (x)
        const L = 12;  // lengte (z)
        const H = 3;   // hoogte (y)

        // --- Materials ---
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xc8a882,
            roughness: 0.6,
            metalness: 0.0
        });
        // Wood grain pattern for floor
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 512;
        floorCanvas.height = 512;
        const fCtx = floorCanvas.getContext('2d');
        fCtx.fillStyle = '#c8a882';
        fCtx.fillRect(0, 0, 512, 512);
        // Draw plank lines
        fCtx.strokeStyle = '#b89970';
        fCtx.lineWidth = 2;
        for (let i = 0; i < 512; i += 64) {
            fCtx.beginPath();
            fCtx.moveTo(0, i);
            fCtx.lineTo(512, i);
            fCtx.stroke();
        }
        // Add some grain
        for (let i = 0; i < 3000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            fCtx.fillStyle = `rgba(160,130,90,${Math.random() * 0.15})`;
            fCtx.fillRect(x, y, Math.random() * 40 + 10, 1);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(W / 2, L / 2);
        floorMat.map = floorTex;

        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xf5f0e8,
            roughness: 0.9,
            metalness: 0.0
        });

        const ceilingMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0.0
        });

        const plintMat = new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            roughness: 0.5
        });

        // --- Room geometry ---
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(W / 2, 0, L / 2);
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, L), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(W / 2, H, L / 2);
        scene.add(ceiling);

        // Back wall (z=0)
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMat);
        backWall.position.set(W / 2, H / 2, 0);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Front wall (z=L) - with window opening
        const frontWallGroup = new THREE.Group();
        // Left section
        const fwLeft = new THREE.Mesh(new THREE.PlaneGeometry(1, H), wallMat);
        fwLeft.position.set(0.5, H / 2, 0);
        frontWallGroup.add(fwLeft);
        // Right section
        const fwRight = new THREE.Mesh(new THREE.PlaneGeometry(1, H), wallMat);
        fwRight.position.set(W - 0.5, H / 2, 0);
        frontWallGroup.add(fwRight);
        // Above window
        const fwTop = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.6), wallMat);
        fwTop.position.set(W / 2, H - 0.3, 0);
        frontWallGroup.add(fwTop);
        // Below window
        const fwBottom = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.8), wallMat);
        fwBottom.position.set(W / 2, 0.4, 0);
        frontWallGroup.add(fwBottom);

        frontWallGroup.rotation.y = Math.PI;
        frontWallGroup.position.z = L;
        scene.add(frontWallGroup);

        // Window glass
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff,
            transparent: true,
            opacity: 0.3,
            roughness: 0.0,
            metalness: 0.1,
            transmission: 0.8,
        });
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.6), glassMat);
        windowGlass.position.set(W / 2, 0.8 + 0.8, L - 0.01);
        windowGlass.rotation.y = Math.PI;
        scene.add(windowGlass);

        // Window frame
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 });
        function addFrame(x, y, z, w, h, d) {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
            frame.position.set(x, y, z);
            frame.castShadow = true;
            scene.add(frame);
        }
        // Window frame borders
        addFrame(W / 2, 0.8, L - 0.01, 2.1, 0.06, 0.06);       // bottom
        addFrame(W / 2, 2.4, L - 0.01, 2.1, 0.06, 0.06);       // top
        addFrame(W / 2 - 1.0, 1.6, L - 0.01, 0.06, 1.66, 0.06); // left
        addFrame(W / 2 + 1.0, 1.6, L - 0.01, 0.06, 1.66, 0.06); // right
        addFrame(W / 2, 1.6, L - 0.01, 0.04, 1.6, 0.04);        // vertical divider
        addFrame(W / 2, 1.6, L - 0.01, 2.0, 0.04, 0.04);        // horizontal divider

        // Left wall (x=0)
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(0, H / 2, L / 2);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Right wall (x=W)
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(W, H / 2, L / 2);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // --- Plinten (baseboards) ---
        function addPlint(x, y, z, w, rotY) {
            const plint = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.015), plintMat);
            plint.position.set(x, y, z);
            plint.rotation.y = rotY;
            scene.add(plint);
        }
        addPlint(W / 2, 0.04, 0.01, W, 0);           // back wall
        addPlint(0.01, 0.04, L / 2, L, Math.PI / 2);  // left wall
        addPlint(W - 0.01, 0.04, L / 2, L, Math.PI / 2); // right wall

        // --- Lighting ---
        // Ambient
        const ambient = new THREE.AmbientLight(0xfff5e6, 0.4);
        scene.add(ambient);

        // Main ceiling light
        const ceilingLight = new THREE.PointLight(0xfff5e0, 1.2, 20);
        ceilingLight.position.set(W / 2, H - 0.15, L / 2);
        ceilingLight.castShadow = true;
        ceilingLight.shadow.mapSize.width = 1024;
        ceilingLight.shadow.mapSize.height = 1024;
        scene.add(ceilingLight);

        // Ceiling light fixture
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 });
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture.position.set(W / 2, H - 0.04, L / 2);
        scene.add(fixture);
        const fixtureStem = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem.position.set(W / 2, H - 0.15, L / 2);
        scene.add(fixtureStem);
        const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffeecc, emissiveIntensity: 0.8 });
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb.position.set(W / 2, H - 0.32, L / 2);
        scene.add(bulb);

        // Window light (sunlight from outside)
        const sunLight = new THREE.DirectionalLight(0xfff8e0, 1.5);
        sunLight.position.set(W / 2, 4, L + 5);
        sunLight.target.position.set(W / 2, 0, L / 2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 20;
        sunLight.shadow.camera.left = -5;
        sunLight.shadow.camera.right = 5;
        sunLight.shadow.camera.top = 5;
        sunLight.shadow.camera.bottom = -5;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // Second ceiling light (room is long)
        const ceilingLight2 = new THREE.PointLight(0xfff5e0, 0.8, 15);
        ceilingLight2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(ceilingLight2);

        const fixture2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture2.position.set(W / 2, H - 0.04, L * 0.25);
        scene.add(fixture2);
        const fixtureStem2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(fixtureStem2);
        const bulb2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb2.position.set(W / 2, H - 0.32, L * 0.25);
        scene.add(bulb2);

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
