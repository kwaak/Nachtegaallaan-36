<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtegaallaan 36 - Woonkamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #info h2 { margin-bottom: 4px; font-size: 16px; }
        #dimensions { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Nachtegaallaan 36 - Woonkamer</h2>
        <div id="dimensions">4m breed &times; 12m lang &times; 3m hoog</div>
        <div style="margin-top:6px; font-size:12px; color:#999;">
            Klik + sleep om te draaien<br>
            Scrollwiel om te zoomen<br>
            Rechtermuisknop om te pannen
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(2, 1.5, 6);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        // --- Room dimensions (meters) ---
        const W = 4;   // breedte (x)
        const L = 12;  // lengte (z)
        const H = 3;   // hoogte (y)

        // --- Materials ---
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xc8a882,
            roughness: 0.6,
            metalness: 0.0
        });
        // Wood grain pattern for floor
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 512;
        floorCanvas.height = 512;
        const fCtx = floorCanvas.getContext('2d');
        fCtx.fillStyle = '#c8a882';
        fCtx.fillRect(0, 0, 512, 512);
        // Draw plank lines
        fCtx.strokeStyle = '#b89970';
        fCtx.lineWidth = 2;
        for (let i = 0; i < 512; i += 64) {
            fCtx.beginPath();
            fCtx.moveTo(0, i);
            fCtx.lineTo(512, i);
            fCtx.stroke();
        }
        // Add some grain
        for (let i = 0; i < 3000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            fCtx.fillStyle = `rgba(160,130,90,${Math.random() * 0.15})`;
            fCtx.fillRect(x, y, Math.random() * 40 + 10, 1);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(W / 2, L / 2);
        floorMat.map = floorTex;

        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xf5f0e8,
            roughness: 0.9,
            metalness: 0.0
        });

        const ceilingMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0.0
        });

        const plintMat = new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            roughness: 0.5
        });

        // --- Room geometry ---
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(W / 2, 0, L / 2);
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, L), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(W / 2, H, L / 2);
        scene.add(ceiling);

        // Back wall (z=0)
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(W, H), wallMat);
        backWall.position.set(W / 2, H / 2, 0);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Front wall (z=L) - with window opening
        const frontWallGroup = new THREE.Group();
        // Left section
        const fwLeft = new THREE.Mesh(new THREE.PlaneGeometry(1, H), wallMat);
        fwLeft.position.set(0.5, H / 2, 0);
        frontWallGroup.add(fwLeft);
        // Right section
        const fwRight = new THREE.Mesh(new THREE.PlaneGeometry(1, H), wallMat);
        fwRight.position.set(W - 0.5, H / 2, 0);
        frontWallGroup.add(fwRight);
        // Above window
        const fwTop = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.6), wallMat);
        fwTop.position.set(W / 2, H - 0.3, 0);
        frontWallGroup.add(fwTop);
        // Below window
        const fwBottom = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.8), wallMat);
        fwBottom.position.set(W / 2, 0.4, 0);
        frontWallGroup.add(fwBottom);

        frontWallGroup.rotation.y = Math.PI;
        frontWallGroup.position.z = L;
        scene.add(frontWallGroup);

        // Window glass
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff,
            transparent: true,
            opacity: 0.3,
            roughness: 0.0,
            metalness: 0.1,
            transmission: 0.8,
        });
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.6), glassMat);
        windowGlass.position.set(W / 2, 0.8 + 0.8, L - 0.01);
        windowGlass.rotation.y = Math.PI;
        scene.add(windowGlass);

        // Window frame
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 });
        function addFrame(x, y, z, w, h, d) {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
            frame.position.set(x, y, z);
            frame.castShadow = true;
            scene.add(frame);
        }
        // Window frame borders
        addFrame(W / 2, 0.8, L - 0.01, 2.1, 0.06, 0.06);       // bottom
        addFrame(W / 2, 2.4, L - 0.01, 2.1, 0.06, 0.06);       // top
        addFrame(W / 2 - 1.0, 1.6, L - 0.01, 0.06, 1.66, 0.06); // left
        addFrame(W / 2 + 1.0, 1.6, L - 0.01, 0.06, 1.66, 0.06); // right
        addFrame(W / 2, 1.6, L - 0.01, 0.04, 1.6, 0.04);        // vertical divider
        addFrame(W / 2, 1.6, L - 0.01, 2.0, 0.04, 0.04);        // horizontal divider

        // Left wall (x=0)
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(0, H / 2, L / 2);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Right wall (x=W)
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(W, H / 2, L / 2);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // --- Plinten (baseboards) ---
        function addPlint(x, y, z, w, rotY) {
            const plint = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.015), plintMat);
            plint.position.set(x, y, z);
            plint.rotation.y = rotY;
            scene.add(plint);
        }
        addPlint(W / 2, 0.04, 0.01, W, 0);           // back wall
        addPlint(0.01, 0.04, L / 2, L, Math.PI / 2);  // left wall
        addPlint(W - 0.01, 0.04, L / 2, L, Math.PI / 2); // right wall

        // --- Lighting ---
        // Ambient
        const ambient = new THREE.AmbientLight(0xfff5e6, 0.4);
        scene.add(ambient);

        // Main ceiling light
        const ceilingLight = new THREE.PointLight(0xfff5e0, 1.2, 20);
        ceilingLight.position.set(W / 2, H - 0.15, L / 2);
        ceilingLight.castShadow = true;
        ceilingLight.shadow.mapSize.width = 1024;
        ceilingLight.shadow.mapSize.height = 1024;
        scene.add(ceilingLight);

        // Ceiling light fixture
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 });
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture.position.set(W / 2, H - 0.04, L / 2);
        scene.add(fixture);
        const fixtureStem = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem.position.set(W / 2, H - 0.15, L / 2);
        scene.add(fixtureStem);
        const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffeecc, emissiveIntensity: 0.8 });
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb.position.set(W / 2, H - 0.32, L / 2);
        scene.add(bulb);

        // Window light (sunlight from outside)
        const sunLight = new THREE.DirectionalLight(0xfff8e0, 1.5);
        sunLight.position.set(W / 2, 4, L + 5);
        sunLight.target.position.set(W / 2, 0, L / 2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 20;
        sunLight.shadow.camera.left = -5;
        sunLight.shadow.camera.right = 5;
        sunLight.shadow.camera.top = 5;
        sunLight.shadow.camera.bottom = -5;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // Second ceiling light (room is long)
        const ceilingLight2 = new THREE.PointLight(0xfff5e0, 0.8, 15);
        ceilingLight2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(ceilingLight2);

        const fixture2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture2.position.set(W / 2, H - 0.04, L * 0.25);
        scene.add(fixture2);
        const fixtureStem2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(fixtureStem2);
        const bulb2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb2.position.set(W / 2, H - 0.32, L * 0.25);
        scene.add(bulb2);

        // --- Furniture ---

        // == Sofa (bank) ==
        const sofaMat = new THREE.MeshStandardMaterial({ color: 0x4a6741, roughness: 0.8 });
        const sofaGroup = new THREE.Group();
        // Seat
        const seat = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.9), sofaMat);
        seat.position.set(0, 0.35, 0);
        seat.castShadow = true;
        sofaGroup.add(seat);
        // Back
        const back = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.15), sofaMat);
        back.position.set(0, 0.7, -0.38);
        back.castShadow = true;
        sofaGroup.add(back);
        // Armrests
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, 0.9), sofaMat);
        armL.position.set(-1.05, 0.5, 0);
        armL.castShadow = true;
        sofaGroup.add(armL);
        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, 0.9), sofaMat);
        armR.position.set(1.05, 0.5, 0);
        armR.castShadow = true;
        sofaGroup.add(armR);
        // Cushions
        const cushionMat = new THREE.MeshStandardMaterial({ color: 0x5a7a50, roughness: 0.9 });
        for (let i = -1; i <= 1; i++) {
            const cushion = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.12, 0.75), cushionMat);
            cushion.position.set(i * 0.7, 0.61, 0.02);
            sofaGroup.add(cushion);
        }
        // Throw pillows
        const pillowMat = new THREE.MeshStandardMaterial({ color: 0xc4956a, roughness: 0.9 });
        const pillow1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.1), pillowMat);
        pillow1.position.set(-0.8, 0.75, 0.05);
        pillow1.rotation.z = 0.15;
        sofaGroup.add(pillow1);
        const pillowMat2 = new THREE.MeshStandardMaterial({ color: 0xd4c4a0, roughness: 0.9 });
        const pillow2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.1), pillowMat2);
        pillow2.position.set(0.85, 0.75, 0.05);
        pillow2.rotation.z = -0.1;
        sofaGroup.add(pillow2);

        sofaGroup.position.set(W / 2, 0, L * 0.55);
        sofaGroup.rotation.y = Math.PI;
        scene.add(sofaGroup);

        // == Coffee table (salontafel) ==
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b6e4e, roughness: 0.5 });
        const tableGroup = new THREE.Group();
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.04, 0.6), tableMat);
        tableTop.position.set(0, 0.42, 0);
        tableTop.castShadow = true;
        tableGroup.add(tableTop);
        // Legs
        const legMat = new THREE.MeshStandardMaterial({ color: 0x6b5030, roughness: 0.4 });
        const legPositions = [[-0.42, 0.2, -0.24], [0.42, 0.2, -0.24], [-0.42, 0.2, 0.24], [0.42, 0.2, 0.24]];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), legMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            tableGroup.add(leg);
        });
        tableGroup.position.set(W / 2, 0, L * 0.55 + 1.0);
        scene.add(tableGroup);

        // == TV meubel + TV ==
        const tvCabinetMat = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.6 });
        const tvCabinet = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 0.4), tvCabinetMat);
        tvCabinet.position.set(W / 2, 0.225, L * 0.55 + 2.8);
        tvCabinet.castShadow = true;
        tvCabinet.receiveShadow = true;
        scene.add(tvCabinet);

        // TV
        const tvMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.5 });
        const tv = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.04), tvMat);
        tv.position.set(W / 2, 0.45 + 0.45, L * 0.55 + 2.8);
        tv.castShadow = true;
        scene.add(tv);
        // TV screen
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.1, metalness: 0.0, emissive: 0x050510, emissiveIntensity: 0.3 });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.72), screenMat);
        screen.position.set(W / 2, 0.45 + 0.45, L * 0.55 + 2.78);
        scene.add(screen);
        // TV stand
        const tvStand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.2), tvMat);
        tvStand.position.set(W / 2, 0.47, L * 0.55 + 2.8);
        scene.add(tvStand);

        // == Boekenkast (bookshelf) along left wall ==
        const shelfMat = new THREE.MeshStandardMaterial({ color: 0xa08060, roughness: 0.6 });
        const bookshelfGroup = new THREE.Group();
        // Frame
        const shelfBack = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.03), shelfMat);
        shelfBack.position.set(0, 0.9, -0.14);
        bookshelfGroup.add(shelfBack);
        const shelfSideL = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.8, 0.3), shelfMat);
        shelfSideL.position.set(-0.39, 0.9, 0);
        bookshelfGroup.add(shelfSideL);
        const shelfSideR = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.8, 0.3), shelfMat);
        shelfSideR.position.set(0.39, 0.9, 0);
        bookshelfGroup.add(shelfSideR);
        // Shelves
        for (let i = 0; i < 5; i++) {
            const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.025, 0.3), shelfMat);
            shelf.position.set(0, i * 0.42 + 0.08, 0);
            bookshelfGroup.add(shelf);
        }
        // Books
        const bookColors = [0xc04040, 0x4040c0, 0x40a040, 0xc0a040, 0x8040a0, 0xd07030, 0x3080a0, 0xa06050];
        for (let row = 0; row < 4; row++) {
            let xOff = -0.32;
            for (let b = 0; b < 6 + Math.floor(Math.random() * 3); b++) {
                const bw = 0.03 + Math.random() * 0.04;
                const bh = 0.25 + Math.random() * 0.12;
                const bookMat = new THREE.MeshStandardMaterial({
                    color: bookColors[Math.floor(Math.random() * bookColors.length)],
                    roughness: 0.8
                });
                const book = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.2), bookMat);
                book.position.set(xOff + bw / 2, row * 0.42 + 0.08 + bh / 2 + 0.015, 0);
                bookshelfGroup.add(book);
                xOff += bw + 0.005;
                if (xOff > 0.3) break;
            }
        }
        bookshelfGroup.position.set(0.42, 0, L * 0.3);
        scene.add(bookshelfGroup);

        // == Eethoek (dining area) near back wall ==
        const diningMat = new THREE.MeshStandardMaterial({ color: 0x9b7e5e, roughness: 0.5 });
        const diningGroup = new THREE.Group();
        // Table
        const dTableTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.04, 0.8), diningMat);
        dTableTop.position.set(0, 0.75, 0);
        dTableTop.castShadow = true;
        diningGroup.add(dTableTop);
        const dLegPositions = [[-0.6, 0.375, -0.32], [0.6, 0.375, -0.32], [-0.6, 0.375, 0.32], [0.6, 0.375, 0.32]];
        dLegPositions.forEach(pos => {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.75, 0.05), diningMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            diningGroup.add(leg);
        });

        // Chairs
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.7 });
        function makeChair(x, z, rotY) {
            const cGroup = new THREE.Group();
            // Seat
            const cSeat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.4), chairMat);
            cSeat.position.set(0, 0.45, 0);
            cGroup.add(cSeat);
            // Legs
            [[-0.16, 0.225, -0.16], [0.16, 0.225, -0.16], [-0.16, 0.225, 0.16], [0.16, 0.225, 0.16]].forEach(p => {
                const cLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.45, 6), chairMat);
                cLeg.position.set(...p);
                cGroup.add(cLeg);
            });
            // Backrest
            const cBack = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.4, 0.03), chairMat);
            cBack.position.set(0, 0.67, -0.18);
            cGroup.add(cBack);
            cGroup.position.set(x, 0, z);
            cGroup.rotation.y = rotY;
            return cGroup;
        }
        diningGroup.add(makeChair(-0.5, -0.6, 0));
        diningGroup.add(makeChair(0.5, -0.6, 0));
        diningGroup.add(makeChair(-0.5, 0.6, Math.PI));
        diningGroup.add(makeChair(0.5, 0.6, Math.PI));

        diningGroup.position.set(W / 2, 0, 1.5);
        scene.add(diningGroup);

        // == Vloerkleed (rug) ==
        const rugCanvas = document.createElement('canvas');
        rugCanvas.width = 256;
        rugCanvas.height = 256;
        const rCtx = rugCanvas.getContext('2d');
        rCtx.fillStyle = '#8b7b6b';
        rCtx.fillRect(0, 0, 256, 256);
        rCtx.strokeStyle = '#706050';
        rCtx.lineWidth = 8;
        rCtx.strokeRect(16, 16, 224, 224);
        rCtx.strokeStyle = '#a09080';
        rCtx.lineWidth = 3;
        rCtx.strokeRect(30, 30, 196, 196);
        // Diamond pattern
        rCtx.strokeStyle = '#605040';
        rCtx.lineWidth = 1.5;
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                const cx = 50 + i * 32;
                const cy = 50 + j * 32;
                rCtx.beginPath();
                rCtx.moveTo(cx, cy - 10);
                rCtx.lineTo(cx + 10, cy);
                rCtx.lineTo(cx, cy + 10);
                rCtx.lineTo(cx - 10, cy);
                rCtx.closePath();
                rCtx.stroke();
            }
        }
        const rugTex = new THREE.CanvasTexture(rugCanvas);
        const rugMat = new THREE.MeshStandardMaterial({ map: rugTex, roughness: 0.95 });
        const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.0), rugMat);
        rug.rotation.x = -Math.PI / 2;
        rug.position.set(W / 2, 0.005, L * 0.55 + 1.0);
        scene.add(rug);

        // == Staande lamp (floor lamp) ==
        const lampGroup = new THREE.Group();
        const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.03, 16), fixtureMat);
        lampBase.position.set(0, 0.015, 0);
        lampGroup.add(lampBase);
        const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.5, 8), fixtureMat);
        lampPole.position.set(0, 0.78, 0);
        lampGroup.add(lampPole);
        const shadeMat = new THREE.MeshStandardMaterial({
            color: 0xf5e6c8, roughness: 0.9, side: THREE.DoubleSide,
            emissive: 0xffe0a0, emissiveIntensity: 0.15
        });
        const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.25, 16, 1, true), shadeMat);
        shade.position.set(0, 1.6, 0);
        lampGroup.add(shade);
        const lampLight = new THREE.PointLight(0xffe0a0, 0.5, 5);
        lampLight.position.set(0, 1.5, 0);
        lampGroup.add(lampLight);
        lampGroup.position.set(W - 0.35, 0, L * 0.55 - 0.9);
        scene.add(lampGroup);

        // == Plant ==
        const plantGroup = new THREE.Group();
        const potMat = new THREE.MeshStandardMaterial({ color: 0xc47a4a, roughness: 0.7 });
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.2, 12), potMat);
        pot.position.set(0, 0.1, 0);
        plantGroup.add(pot);
        const dirtMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1.0 });
        const dirt = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.02, 12), dirtMat);
        dirt.position.set(0, 0.21, 0);
        plantGroup.add(dirt);
        // Leaves
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6b30, roughness: 0.8, side: THREE.DoubleSide });
        for (let i = 0; i < 8; i++) {
            const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.3), leafMat);
            const angle = (i / 8) * Math.PI * 2;
            leaf.position.set(Math.cos(angle) * 0.06, 0.4 + Math.random() * 0.15, Math.sin(angle) * 0.06);
            leaf.rotation.y = angle;
            leaf.rotation.x = -0.3 - Math.random() * 0.3;
            plantGroup.add(leaf);
        }
        plantGroup.position.set(0.3, 0, L - 0.4);
        scene.add(plantGroup);

        // == Schilderij (painting) on back wall ==
        const paintingGroup = new THREE.Group();
        const pFrameMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.3 });
        const pFrame = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.65, 0.04), pFrameMat);
        pFrame.position.set(0, 0, 0);
        paintingGroup.add(pFrame);
        // Canvas with abstract art
        const artCanvas = document.createElement('canvas');
        artCanvas.width = 256;
        artCanvas.height = 180;
        const aCtx = artCanvas.getContext('2d');
        // Gradient background
        const grad = aCtx.createLinearGradient(0, 0, 256, 180);
        grad.addColorStop(0, '#2a4a6a');
        grad.addColorStop(0.5, '#5a7a4a');
        grad.addColorStop(1, '#8a6a3a');
        aCtx.fillStyle = grad;
        aCtx.fillRect(0, 0, 256, 180);
        // Abstract shapes
        aCtx.fillStyle = 'rgba(255,200,100,0.4)';
        aCtx.beginPath();
        aCtx.arc(180, 50, 40, 0, Math.PI * 2);
        aCtx.fill();
        aCtx.fillStyle = 'rgba(100,150,200,0.3)';
        aCtx.fillRect(30, 60, 80, 80);
        const artTex = new THREE.CanvasTexture(artCanvas);
        const artMat = new THREE.MeshStandardMaterial({ map: artTex, roughness: 0.5 });
        const art = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.55), artMat);
        art.position.set(0, 0, 0.025);
        paintingGroup.add(art);
        paintingGroup.position.set(W / 2, 1.8, 0.03);
        scene.add(paintingGroup);

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
