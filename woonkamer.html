<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtegaallaan 36 - Woonkamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #info h2 { margin-bottom: 4px; font-size: 16px; }
        #dimensions { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Nachtegaallaan 36 - Woonkamer</h2>
        <div id="dimensions">4m breed &times; 12m lang &times; 3m hoog</div>
        <div style="margin-top:6px; font-size:12px; color:#999;">
            Klik + sleep om te draaien<br>
            Scrollwiel om te zoomen<br>
            Rechtermuisknop om te pannen
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(2, 1.5, 6);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        // --- Room dimensions (meters) ---
        const W = 4;   // breedte (x)
        const L = 12;  // lengte (z)
        const H = 3;   // hoogte (y)

        // --- Materials ---
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xc8a882,
            roughness: 0.6,
            metalness: 0.0
        });
        // Wood grain pattern for floor
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 512;
        floorCanvas.height = 512;
        const fCtx = floorCanvas.getContext('2d');
        fCtx.fillStyle = '#c8a882';
        fCtx.fillRect(0, 0, 512, 512);
        // Draw plank lines
        fCtx.strokeStyle = '#b89970';
        fCtx.lineWidth = 2;
        for (let i = 0; i < 512; i += 64) {
            fCtx.beginPath();
            fCtx.moveTo(0, i);
            fCtx.lineTo(512, i);
            fCtx.stroke();
        }
        // Add some grain
        for (let i = 0; i < 3000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            fCtx.fillStyle = `rgba(160,130,90,${Math.random() * 0.15})`;
            fCtx.fillRect(x, y, Math.random() * 40 + 10, 1);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(W / 2, L / 2);
        floorMat.map = floorTex;

        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xf5f0e8,
            roughness: 0.9,
            metalness: 0.0
        });

        const ceilingMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0.0
        });

        const plintMat = new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            roughness: 0.5
        });

        // --- Room geometry ---
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(W / 2, 0, L / 2);
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, L), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(W / 2, H, L / 2);
        scene.add(ceiling);

        // Back wall (z=0) - with doorgang (passage) with two doors
        const backWallGroup = new THREE.Group();
        // Door opening: 1.6m wide (two 0.8m doors), 2.1m high, centered
        const bwDoorW = 1.6;
        const bwDoorH = 2.1;
        const bwDoorX = W / 2; // centered
        // Left section of back wall
        const bwLeft = new THREE.Mesh(new THREE.PlaneGeometry(bwDoorX - bwDoorW / 2, H), wallMat);
        bwLeft.position.set((bwDoorX - bwDoorW / 2) / 2, H / 2, 0);
        backWallGroup.add(bwLeft);
        // Right section of back wall
        const bwRight = new THREE.Mesh(new THREE.PlaneGeometry(W - (bwDoorX + bwDoorW / 2), H), wallMat);
        bwRight.position.set((bwDoorX + bwDoorW / 2) + (W - (bwDoorX + bwDoorW / 2)) / 2, H / 2, 0);
        backWallGroup.add(bwRight);
        // Above door
        const bwAbove = new THREE.Mesh(new THREE.PlaneGeometry(bwDoorW, H - bwDoorH), wallMat);
        bwAbove.position.set(bwDoorX, bwDoorH + (H - bwDoorH) / 2, 0);
        backWallGroup.add(bwAbove);
        backWallGroup.position.z = 0;
        backWallGroup.receiveShadow = true;
        scene.add(backWallGroup);

        // Door frame for passage
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 });
        function addFrame(x, y, z, w, h, d) {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
            frame.position.set(x, y, z);
            frame.castShadow = true;
            scene.add(frame);
        }
        // Passage door frame
        addFrame(bwDoorX - bwDoorW / 2, bwDoorH / 2, 0, 0.05, bwDoorH, 0.1);        // left post
        addFrame(bwDoorX + bwDoorW / 2, bwDoorH / 2, 0, 0.05, bwDoorH, 0.1);        // right post
        addFrame(bwDoorX, bwDoorH, 0, bwDoorW + 0.05, 0.05, 0.1);                    // top beam

        // Two doors in the passage
        const doorMat = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.6 });
        // Left door (slightly ajar - rotated open)
        const doorL = new THREE.Mesh(new THREE.BoxGeometry(0.78, bwDoorH - 0.05, 0.04), doorMat);
        doorL.geometry.translate(0.39, 0, 0); // pivot at left edge
        doorL.position.set(bwDoorX - bwDoorW / 2 + 0.02, bwDoorH / 2, 0);
        doorL.rotation.y = 0.4; // slightly open
        scene.add(doorL);
        // Right door (closed)
        const doorR = new THREE.Mesh(new THREE.BoxGeometry(0.78, bwDoorH - 0.05, 0.04), doorMat);
        doorR.geometry.translate(-0.39, 0, 0); // pivot at right edge
        doorR.position.set(bwDoorX + bwDoorW / 2 - 0.02, bwDoorH / 2, 0);
        scene.add(doorR);
        // Door handles
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8, roughness: 0.2 });
        const handleL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.03), handleMat);
        handleL.position.set(0.68, 0, 0.03);
        doorL.add(handleL);
        const handleR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.03), handleMat);
        handleR.position.set(-0.68, bwDoorH / 2, 0.03);
        doorR.add(handleR);

        // Front wall (z=L) - large window across almost entire width (~3.5m)
        const frontWallGroup = new THREE.Group();
        const fwGlassW = 3.5;  // window width
        const fwGlassBottom = 0.3;  // sill height
        const fwGlassTop = 2.7;     // top of glass
        const fwGlassH = fwGlassTop - fwGlassBottom;
        const fwSideW = (W - fwGlassW) / 2; // 0.25m each side
        // Left narrow section
        const fwLeft = new THREE.Mesh(new THREE.PlaneGeometry(fwSideW, H), wallMat);
        fwLeft.position.set(fwSideW / 2, H / 2, 0);
        frontWallGroup.add(fwLeft);
        // Right narrow section
        const fwRight = new THREE.Mesh(new THREE.PlaneGeometry(fwSideW, H), wallMat);
        fwRight.position.set(W - fwSideW / 2, H / 2, 0);
        frontWallGroup.add(fwRight);
        // Above window
        const fwTop = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, H - fwGlassTop), wallMat);
        fwTop.position.set(W / 2, fwGlassTop + (H - fwGlassTop) / 2, 0);
        frontWallGroup.add(fwTop);
        // Below window (sill)
        const fwBottom = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, fwGlassBottom), wallMat);
        fwBottom.position.set(W / 2, fwGlassBottom / 2, 0);
        frontWallGroup.add(fwBottom);

        frontWallGroup.rotation.y = Math.PI;
        frontWallGroup.position.z = L;
        scene.add(frontWallGroup);

        // Large front window glass
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff,
            transparent: true,
            opacity: 0.3,
            roughness: 0.0,
            metalness: 0.1,
            transmission: 0.8,
        });
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, fwGlassH), glassMat);
        windowGlass.position.set(W / 2, fwGlassBottom + fwGlassH / 2, L - 0.01);
        windowGlass.rotation.y = Math.PI;
        scene.add(windowGlass);

        // Window frame for large front window
        // Outer frame
        addFrame(W / 2, fwGlassBottom, L - 0.01, fwGlassW + 0.06, 0.06, 0.06);  // bottom sill
        addFrame(W / 2, fwGlassTop, L - 0.01, fwGlassW + 0.06, 0.06, 0.06);     // top
        addFrame(W / 2 - fwGlassW / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.06, fwGlassH, 0.06); // left
        addFrame(W / 2 + fwGlassW / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.06, fwGlassH, 0.06); // right
        // Vertical dividers (4 panels)
        for (let i = 1; i < 4; i++) {
            const divX = (W - fwGlassW) / 2 + i * (fwGlassW / 4);
            addFrame(divX, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.03, fwGlassH, 0.03);
        }
        // Horizontal divider
        addFrame(W / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, fwGlassW, 0.03, 0.03);

        // Left wall (x=0) - with door to kitchen
        const leftWallGroup = new THREE.Group();
        const kitchenDoorW = 0.85;
        const kitchenDoorH = 2.1;
        const kitchenDoorZ = 3.0; // position along the wall (distance from z=0)
        // Section before door
        const lwBefore = new THREE.Mesh(new THREE.PlaneGeometry(kitchenDoorZ - kitchenDoorW / 2, H), wallMat);
        lwBefore.position.set((kitchenDoorZ - kitchenDoorW / 2) / 2, H / 2, 0);
        leftWallGroup.add(lwBefore);
        // Section after door
        const lwAfterStart = kitchenDoorZ + kitchenDoorW / 2;
        const lwAfterW = L - lwAfterStart;
        const lwAfter = new THREE.Mesh(new THREE.PlaneGeometry(lwAfterW, H), wallMat);
        lwAfter.position.set(lwAfterStart + lwAfterW / 2, H / 2, 0);
        leftWallGroup.add(lwAfter);
        // Above door
        const lwAbove = new THREE.Mesh(new THREE.PlaneGeometry(kitchenDoorW, H - kitchenDoorH), wallMat);
        lwAbove.position.set(kitchenDoorZ, kitchenDoorH + (H - kitchenDoorH) / 2, 0);
        leftWallGroup.add(lwAbove);
        leftWallGroup.rotation.y = Math.PI / 2;
        leftWallGroup.position.set(0, 0, 0);
        leftWallGroup.receiveShadow = true;
        scene.add(leftWallGroup);

        // Kitchen door frame
        addFrame(0, kitchenDoorH / 2, kitchenDoorZ - kitchenDoorW / 2, 0.1, kitchenDoorH, 0.05);  // left post
        addFrame(0, kitchenDoorH / 2, kitchenDoorZ + kitchenDoorW / 2, 0.1, kitchenDoorH, 0.05);  // right post
        addFrame(0, kitchenDoorH, kitchenDoorZ, 0.1, 0.05, kitchenDoorW + 0.05);                   // top beam

        // Kitchen door (slightly open)
        const kitchenDoor = new THREE.Mesh(new THREE.BoxGeometry(0.04, kitchenDoorH - 0.05, 0.83), doorMat);
        kitchenDoor.geometry.translate(0, 0, 0.415); // pivot at one edge
        kitchenDoor.position.set(0, kitchenDoorH / 2, kitchenDoorZ - kitchenDoorW / 2 + 0.02);
        kitchenDoor.rotation.y = -0.5; // slightly open into kitchen
        scene.add(kitchenDoor);
        // Kitchen door handle
        const kHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.1), handleMat);
        kHandle.position.set(0.03, 0, 0.7);
        kitchenDoor.add(kHandle);

        // Right wall (x=W)
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(W, H / 2, L / 2);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // --- Plinten (baseboards) - split around door openings ---
        function addPlint(x, y, z, w, rotY) {
            const plint = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.015), plintMat);
            plint.position.set(x, y, z);
            plint.rotation.y = rotY;
            scene.add(plint);
        }
        // Back wall: left of passage, right of passage
        const bwPlintL = (bwDoorX - bwDoorW / 2);
        addPlint(bwPlintL / 2, 0.04, 0.01, bwPlintL, 0);
        const bwPlintRStart = bwDoorX + bwDoorW / 2;
        const bwPlintRW = W - bwPlintRStart;
        addPlint(bwPlintRStart + bwPlintRW / 2, 0.04, 0.01, bwPlintRW, 0);
        // Left wall: before kitchen door, after kitchen door
        const lwPlintBefore = kitchenDoorZ - kitchenDoorW / 2;
        addPlint(0.01, 0.04, lwPlintBefore / 2, lwPlintBefore, Math.PI / 2);
        const lwPlintAfterStart = kitchenDoorZ + kitchenDoorW / 2;
        const lwPlintAfterW = L - lwPlintAfterStart;
        addPlint(0.01, 0.04, lwPlintAfterStart + lwPlintAfterW / 2, lwPlintAfterW, Math.PI / 2);
        // Right wall (full length, no doors)
        addPlint(W - 0.01, 0.04, L / 2, L, Math.PI / 2);

        // --- Lighting ---
        // Ambient
        const ambient = new THREE.AmbientLight(0xfff5e6, 0.4);
        scene.add(ambient);

        // Main ceiling light
        const ceilingLight = new THREE.PointLight(0xfff5e0, 1.2, 20);
        ceilingLight.position.set(W / 2, H - 0.15, L / 2);
        ceilingLight.castShadow = true;
        ceilingLight.shadow.mapSize.width = 1024;
        ceilingLight.shadow.mapSize.height = 1024;
        scene.add(ceilingLight);

        // Ceiling light fixture
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 });
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture.position.set(W / 2, H - 0.04, L / 2);
        scene.add(fixture);
        const fixtureStem = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem.position.set(W / 2, H - 0.15, L / 2);
        scene.add(fixtureStem);
        const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffeecc, emissiveIntensity: 0.8 });
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb.position.set(W / 2, H - 0.32, L / 2);
        scene.add(bulb);

        // Window light (sunlight from outside)
        const sunLight = new THREE.DirectionalLight(0xfff8e0, 1.5);
        sunLight.position.set(W / 2, 4, L + 5);
        sunLight.target.position.set(W / 2, 0, L / 2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 20;
        sunLight.shadow.camera.left = -5;
        sunLight.shadow.camera.right = 5;
        sunLight.shadow.camera.top = 5;
        sunLight.shadow.camera.bottom = -5;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // Second ceiling light (room is long)
        const ceilingLight2 = new THREE.PointLight(0xfff5e0, 0.8, 15);
        ceilingLight2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(ceilingLight2);

        const fixture2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture2.position.set(W / 2, H - 0.04, L * 0.25);
        scene.add(fixture2);
        const fixtureStem2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(fixtureStem2);
        const bulb2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb2.position.set(W / 2, H - 0.32, L * 0.25);
        scene.add(bulb2);

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
