<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachtegaallaan 36 - Woonkamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #info h2 { margin-bottom: 4px; font-size: 16px; }
        #dimensions { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <h2>Nachtegaallaan 36 - Woonkamer</h2>
        <div id="dimensions">4m breed &times; 12m lang &times; 3m hoog</div>
        <div style="margin-top:6px; font-size:12px; color:#999;">
            Klik + sleep om te draaien<br>
            Scrollwiel om te zoomen<br>
            Rechtermuisknop om te pannen
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(2, 1.5, 6);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.update();

        // --- Room dimensions (meters) ---
        const W = 4;   // breedte (x)
        const L = 12;  // lengte (z)
        const H = 3;   // hoogte (y)

        // --- Materials ---
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xc8a882,
            roughness: 0.6,
            metalness: 0.0
        });
        // Wood grain pattern for floor
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 512;
        floorCanvas.height = 512;
        const fCtx = floorCanvas.getContext('2d');
        fCtx.fillStyle = '#c8a882';
        fCtx.fillRect(0, 0, 512, 512);
        // Draw plank lines
        fCtx.strokeStyle = '#b89970';
        fCtx.lineWidth = 2;
        for (let i = 0; i < 512; i += 64) {
            fCtx.beginPath();
            fCtx.moveTo(0, i);
            fCtx.lineTo(512, i);
            fCtx.stroke();
        }
        // Add some grain
        for (let i = 0; i < 3000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            fCtx.fillStyle = `rgba(160,130,90,${Math.random() * 0.15})`;
            fCtx.fillRect(x, y, Math.random() * 40 + 10, 1);
        }
        const floorTex = new THREE.CanvasTexture(floorCanvas);
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(W / 2, L / 2);
        floorMat.map = floorTex;

        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xf5f0e8,
            roughness: 0.9,
            metalness: 0.0
        });

        const ceilingMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0.0
        });

        const plintMat = new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            roughness: 0.5
        });

        // --- Room geometry ---
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(W / 2, 0, L / 2);
        floor.receiveShadow = true;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, L), ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(W / 2, H, L / 2);
        scene.add(ceiling);

        // --- Shared materials for doors/frames ---
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 });
        const doorMat = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.6 });
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8, roughness: 0.2 });
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xaaddff, transparent: true, opacity: 0.3,
            roughness: 0.0, metalness: 0.1, transmission: 0.8,
        });
        function addFrame(x, y, z, w, h, d) {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat);
            frame.position.set(x, y, z);
            frame.castShadow = true;
            scene.add(frame);
        }

        // =============================================
        // Back wall (z=0) - TUINKANT - groot raam + tuindeur
        // =============================================
        // Layout (x): [0.25 wall][0.9 tuindeur][0.35 wall][2.0 raam][0.5 wall]
        const gardenDoorW = 0.9;
        const gardenDoorH = 2.1;
        const gardenDoorX = 0.7;   // center of garden door
        const bwWinW = 2.0;
        const bwWinX = 2.55;       // center of back window
        const bwWinBottom = 0.3;
        const bwWinTop = 2.4;
        const bwWinH = bwWinTop - bwWinBottom;

        const backWallGroup = new THREE.Group();
        // Section 1: left of garden door
        const bw1W = gardenDoorX - gardenDoorW / 2;
        const bw1 = new THREE.Mesh(new THREE.PlaneGeometry(bw1W, H), wallMat);
        bw1.position.set(bw1W / 2, H / 2, 0);
        backWallGroup.add(bw1);
        // Section 2: above garden door
        const bw2 = new THREE.Mesh(new THREE.PlaneGeometry(gardenDoorW, H - gardenDoorH), wallMat);
        bw2.position.set(gardenDoorX, gardenDoorH + (H - gardenDoorH) / 2, 0);
        backWallGroup.add(bw2);
        // Section 3: between door and window
        const bw3Left = gardenDoorX + gardenDoorW / 2;
        const bw3Right = bwWinX - bwWinW / 2;
        const bw3W = bw3Right - bw3Left;
        const bw3 = new THREE.Mesh(new THREE.PlaneGeometry(bw3W, H), wallMat);
        bw3.position.set(bw3Left + bw3W / 2, H / 2, 0);
        backWallGroup.add(bw3);
        // Section 4: below window
        const bw4 = new THREE.Mesh(new THREE.PlaneGeometry(bwWinW, bwWinBottom), wallMat);
        bw4.position.set(bwWinX, bwWinBottom / 2, 0);
        backWallGroup.add(bw4);
        // Section 5: above window
        const bw5 = new THREE.Mesh(new THREE.PlaneGeometry(bwWinW, H - bwWinTop), wallMat);
        bw5.position.set(bwWinX, bwWinTop + (H - bwWinTop) / 2, 0);
        backWallGroup.add(bw5);
        // Section 6: right of window
        const bw6Left = bwWinX + bwWinW / 2;
        const bw6W = W - bw6Left;
        const bw6 = new THREE.Mesh(new THREE.PlaneGeometry(bw6W, H), wallMat);
        bw6.position.set(bw6Left + bw6W / 2, H / 2, 0);
        backWallGroup.add(bw6);

        backWallGroup.position.z = 0;
        backWallGroup.receiveShadow = true;
        scene.add(backWallGroup);

        // Garden door frame
        addFrame(gardenDoorX - gardenDoorW / 2, gardenDoorH / 2, 0, 0.05, gardenDoorH, 0.1);
        addFrame(gardenDoorX + gardenDoorW / 2, gardenDoorH / 2, 0, 0.05, gardenDoorH, 0.1);
        addFrame(gardenDoorX, gardenDoorH, 0, gardenDoorW + 0.05, 0.05, 0.1);
        // Garden door (with glass panel, slightly open)
        const gardenDoor = new THREE.Mesh(new THREE.BoxGeometry(0.88, gardenDoorH - 0.05, 0.04), doorMat);
        gardenDoor.geometry.translate(0.44, 0, 0); // pivot at left edge
        gardenDoor.position.set(gardenDoorX - gardenDoorW / 2 + 0.02, gardenDoorH / 2, 0);
        gardenDoor.rotation.y = -0.3;
        scene.add(gardenDoor);
        // Glass in garden door (upper half)
        const gdGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0), glassMat);
        gdGlass.position.set(0.44, 0.35, 0.025);
        gardenDoor.add(gdGlass);
        // Garden door handle
        const gdHandle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.03), handleMat);
        gdHandle.position.set(0.76, 0, 0.03);
        gardenDoor.add(gdHandle);

        // Back window glass
        const bwGlass = new THREE.Mesh(new THREE.PlaneGeometry(bwWinW, bwWinH), glassMat);
        bwGlass.position.set(bwWinX, bwWinBottom + bwWinH / 2, 0.01);
        scene.add(bwGlass);
        // Back window frame
        addFrame(bwWinX, bwWinBottom, 0.01, bwWinW + 0.06, 0.06, 0.06);
        addFrame(bwWinX, bwWinTop, 0.01, bwWinW + 0.06, 0.06, 0.06);
        addFrame(bwWinX - bwWinW / 2, bwWinBottom + bwWinH / 2, 0.01, 0.06, bwWinH, 0.06);
        addFrame(bwWinX + bwWinW / 2, bwWinBottom + bwWinH / 2, 0.01, 0.06, bwWinH, 0.06);
        addFrame(bwWinX, bwWinBottom + bwWinH / 2, 0.01, 0.03, bwWinH, 0.03); // vertical divider
        addFrame(bwWinX, bwWinBottom + bwWinH / 2, 0.01, bwWinW, 0.03, 0.03); // horizontal divider

        // Front wall (z=L) - large window across almost entire width (~3.5m)
        const frontWallGroup = new THREE.Group();
        const fwGlassW = 3.5;  // window width
        const fwGlassBottom = 0.3;  // sill height
        const fwGlassTop = 2.7;     // top of glass
        const fwGlassH = fwGlassTop - fwGlassBottom;
        const fwSideW = (W - fwGlassW) / 2; // 0.25m each side
        // Left narrow section
        const fwLeft = new THREE.Mesh(new THREE.PlaneGeometry(fwSideW, H), wallMat);
        fwLeft.position.set(fwSideW / 2, H / 2, 0);
        frontWallGroup.add(fwLeft);
        // Right narrow section
        const fwRight = new THREE.Mesh(new THREE.PlaneGeometry(fwSideW, H), wallMat);
        fwRight.position.set(W - fwSideW / 2, H / 2, 0);
        frontWallGroup.add(fwRight);
        // Above window
        const fwTop = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, H - fwGlassTop), wallMat);
        fwTop.position.set(W / 2, fwGlassTop + (H - fwGlassTop) / 2, 0);
        frontWallGroup.add(fwTop);
        // Below window (sill)
        const fwBottom = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, fwGlassBottom), wallMat);
        fwBottom.position.set(W / 2, fwGlassBottom / 2, 0);
        frontWallGroup.add(fwBottom);

        frontWallGroup.rotation.y = Math.PI;
        frontWallGroup.position.z = L;
        scene.add(frontWallGroup);

        // Large front window glass
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(fwGlassW, fwGlassH), glassMat);
        windowGlass.position.set(W / 2, fwGlassBottom + fwGlassH / 2, L - 0.01);
        windowGlass.rotation.y = Math.PI;
        scene.add(windowGlass);

        // Window frame for large front window
        // Outer frame
        addFrame(W / 2, fwGlassBottom, L - 0.01, fwGlassW + 0.06, 0.06, 0.06);  // bottom sill
        addFrame(W / 2, fwGlassTop, L - 0.01, fwGlassW + 0.06, 0.06, 0.06);     // top
        addFrame(W / 2 - fwGlassW / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.06, fwGlassH, 0.06); // left
        addFrame(W / 2 + fwGlassW / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.06, fwGlassH, 0.06); // right
        // Vertical dividers (4 panels)
        for (let i = 1; i < 4; i++) {
            const divX = (W - fwGlassW) / 2 + i * (fwGlassW / 4);
            addFrame(divX, fwGlassBottom + fwGlassH / 2, L - 0.01, 0.03, fwGlassH, 0.03);
        }
        // Horizontal divider
        addFrame(W / 2, fwGlassBottom + fwGlassH / 2, L - 0.01, fwGlassW, 0.03, 0.03);

        // =============================================
        // Left wall (x=0) - GANGKANT - dubbele deuren + keukendeur
        // =============================================
        // Layout (z): [0..2.08 wall][2.08..2.93 keukendeur][2.93..9.2 wall][9.2..10.8 dubbele deuren][10.8..12 wall]
        const kitchenDoorW = 0.85;
        const kitchenDoorH = 2.1;
        const kitchenDoorZ = 2.5;     // center of kitchen door (near back/garden)
        const gangDoorW = 1.6;        // double doors width
        const gangDoorH = 2.1;
        const gangDoorZ = 10.0;       // center of double doors (near front/street)

        const leftWallGroup = new THREE.Group();
        // Section 1: z=0 to kitchen door
        const lw1W = kitchenDoorZ - kitchenDoorW / 2;
        const lw1 = new THREE.Mesh(new THREE.PlaneGeometry(lw1W, H), wallMat);
        lw1.position.set(lw1W / 2, H / 2, 0);
        leftWallGroup.add(lw1);
        // Section 2: above kitchen door
        const lw2 = new THREE.Mesh(new THREE.PlaneGeometry(kitchenDoorW, H - kitchenDoorH), wallMat);
        lw2.position.set(kitchenDoorZ, kitchenDoorH + (H - kitchenDoorH) / 2, 0);
        leftWallGroup.add(lw2);
        // Section 3: between kitchen door and double doors
        const lw3Left = kitchenDoorZ + kitchenDoorW / 2;
        const lw3Right = gangDoorZ - gangDoorW / 2;
        const lw3W = lw3Right - lw3Left;
        const lw3 = new THREE.Mesh(new THREE.PlaneGeometry(lw3W, H), wallMat);
        lw3.position.set(lw3Left + lw3W / 2, H / 2, 0);
        leftWallGroup.add(lw3);
        // Section 4: above double doors
        const lw4 = new THREE.Mesh(new THREE.PlaneGeometry(gangDoorW, H - gangDoorH), wallMat);
        lw4.position.set(gangDoorZ, gangDoorH + (H - gangDoorH) / 2, 0);
        leftWallGroup.add(lw4);
        // Section 5: after double doors to z=L
        const lw5Left = gangDoorZ + gangDoorW / 2;
        const lw5W = L - lw5Left;
        const lw5 = new THREE.Mesh(new THREE.PlaneGeometry(lw5W, H), wallMat);
        lw5.position.set(lw5Left + lw5W / 2, H / 2, 0);
        leftWallGroup.add(lw5);

        leftWallGroup.rotation.y = Math.PI / 2;
        leftWallGroup.position.set(0, 0, 0);
        leftWallGroup.receiveShadow = true;
        scene.add(leftWallGroup);

        // --- Kitchen door frame + door ---
        addFrame(0, kitchenDoorH / 2, kitchenDoorZ - kitchenDoorW / 2, 0.1, kitchenDoorH, 0.05);
        addFrame(0, kitchenDoorH / 2, kitchenDoorZ + kitchenDoorW / 2, 0.1, kitchenDoorH, 0.05);
        addFrame(0, kitchenDoorH, kitchenDoorZ, 0.1, 0.05, kitchenDoorW + 0.05);
        const kitchenDoor = new THREE.Mesh(new THREE.BoxGeometry(0.04, kitchenDoorH - 0.05, 0.83), doorMat);
        kitchenDoor.geometry.translate(0, 0, 0.415);
        kitchenDoor.position.set(0, kitchenDoorH / 2, kitchenDoorZ - kitchenDoorW / 2 + 0.02);
        kitchenDoor.rotation.y = -0.5;
        scene.add(kitchenDoor);
        const kHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.1), handleMat);
        kHandle.position.set(0.03, 0, 0.7);
        kitchenDoor.add(kHandle);

        // --- Double doors to hallway (gang) frame + doors ---
        addFrame(0, gangDoorH / 2, gangDoorZ - gangDoorW / 2, 0.1, gangDoorH, 0.05);
        addFrame(0, gangDoorH / 2, gangDoorZ + gangDoorW / 2, 0.1, gangDoorH, 0.05);
        addFrame(0, gangDoorH, gangDoorZ, 0.1, 0.05, gangDoorW + 0.05);
        // Left door (slightly open)
        const gangDoorL = new THREE.Mesh(new THREE.BoxGeometry(0.04, gangDoorH - 0.05, 0.78), doorMat);
        gangDoorL.geometry.translate(0, 0, 0.39);
        gangDoorL.position.set(0, gangDoorH / 2, gangDoorZ - gangDoorW / 2 + 0.02);
        gangDoorL.rotation.y = -0.4;
        scene.add(gangDoorL);
        const ghL = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.1), handleMat);
        ghL.position.set(0.03, 0, 0.68);
        gangDoorL.add(ghL);
        // Right door (closed)
        const gangDoorR = new THREE.Mesh(new THREE.BoxGeometry(0.04, gangDoorH - 0.05, 0.78), doorMat);
        gangDoorR.geometry.translate(0, 0, -0.39);
        gangDoorR.position.set(0, gangDoorH / 2, gangDoorZ + gangDoorW / 2 - 0.02);
        scene.add(gangDoorR);
        const ghR = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.1), handleMat);
        ghR.position.set(0.03, 0, -0.68);
        gangDoorR.add(ghR);

        // Right wall (x=W)
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(L, H), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(W, H / 2, L / 2);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // --- Plinten (baseboards) - split around all door openings ---
        function addPlint(x, y, z, w, rotY) {
            const plint = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.015), plintMat);
            plint.position.set(x, y, z);
            plint.rotation.y = rotY;
            scene.add(plint);
        }
        // Back wall (z=0): left of garden door, between door and window, right of window
        const bwP1W = gardenDoorX - gardenDoorW / 2;
        if (bwP1W > 0.05) addPlint(bwP1W / 2, 0.04, 0.01, bwP1W, 0);
        const bwP2L = gardenDoorX + gardenDoorW / 2;
        const bwP2R = bwWinX - bwWinW / 2;
        const bwP2W = bwP2R - bwP2L;
        if (bwP2W > 0.05) addPlint(bwP2L + bwP2W / 2, 0.04, 0.01, bwP2W, 0);
        // Under window = window sill, no plint needed
        const bwP3L = bwWinX + bwWinW / 2;
        const bwP3W = W - bwP3L;
        if (bwP3W > 0.05) addPlint(bwP3L + bwP3W / 2, 0.04, 0.01, bwP3W, 0);
        // Left wall (x=0): 3 segments around kitchen door and double doors
        const lwP1W = kitchenDoorZ - kitchenDoorW / 2;
        if (lwP1W > 0.05) addPlint(0.01, 0.04, lwP1W / 2, lwP1W, Math.PI / 2);
        const lwP2L = kitchenDoorZ + kitchenDoorW / 2;
        const lwP2R = gangDoorZ - gangDoorW / 2;
        const lwP2W = lwP2R - lwP2L;
        if (lwP2W > 0.05) addPlint(0.01, 0.04, lwP2L + lwP2W / 2, lwP2W, Math.PI / 2);
        const lwP3L = gangDoorZ + gangDoorW / 2;
        const lwP3W = L - lwP3L;
        if (lwP3W > 0.05) addPlint(0.01, 0.04, lwP3L + lwP3W / 2, lwP3W, Math.PI / 2);
        // Right wall (full length, no doors)
        addPlint(W - 0.01, 0.04, L / 2, L, Math.PI / 2);

        // --- Lighting ---
        // Ambient
        const ambient = new THREE.AmbientLight(0xfff5e6, 0.4);
        scene.add(ambient);

        // Main ceiling light
        const ceilingLight = new THREE.PointLight(0xfff5e0, 1.2, 20);
        ceilingLight.position.set(W / 2, H - 0.15, L / 2);
        ceilingLight.castShadow = true;
        ceilingLight.shadow.mapSize.width = 1024;
        ceilingLight.shadow.mapSize.height = 1024;
        scene.add(ceilingLight);

        // Ceiling light fixture
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.8 });
        const fixture = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture.position.set(W / 2, H - 0.04, L / 2);
        scene.add(fixture);
        const fixtureStem = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem.position.set(W / 2, H - 0.15, L / 2);
        scene.add(fixtureStem);
        const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffeecc, emissiveIntensity: 0.8 });
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb.position.set(W / 2, H - 0.32, L / 2);
        scene.add(bulb);

        // Window light (sunlight from outside)
        const sunLight = new THREE.DirectionalLight(0xfff8e0, 1.5);
        sunLight.position.set(W / 2, 4, L + 5);
        sunLight.target.position.set(W / 2, 0, L / 2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 20;
        sunLight.shadow.camera.left = -5;
        sunLight.shadow.camera.right = 5;
        sunLight.shadow.camera.top = 5;
        sunLight.shadow.camera.bottom = -5;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // Second ceiling light (room is long)
        const ceilingLight2 = new THREE.PointLight(0xfff5e0, 0.8, 15);
        ceilingLight2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(ceilingLight2);

        const fixture2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.08, 16), fixtureMat);
        fixture2.position.set(W / 2, H - 0.04, L * 0.25);
        scene.add(fixture2);
        const fixtureStem2 = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.3, 8), fixtureMat);
        fixtureStem2.position.set(W / 2, H - 0.15, L * 0.25);
        scene.add(fixtureStem2);
        const bulb2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), bulbMat);
        bulb2.position.set(W / 2, H - 0.32, L * 0.25);
        scene.add(bulb2);

        // --- Resize handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
